[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-agent-firm"
version = "0.1.0"
description = "GitHub-native agent firm: spec validator, heartbeat engine, badge and dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
agent-firm = "agent_firm.cli:main"

[tool.setuptools]
packages = ["agent_firm"]

[tool.ruff]
line-length = 120
extend-exclude = ["mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
