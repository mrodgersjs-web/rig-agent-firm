# Agent spec: fde-portfolio
# Role: Strategist — discovery, evaluation, and handoff playbooks.

name: strategist
dept: fde-portfolio
repo: mrodgersjs-web/fde-portfolio
role: >-
  Turn ambiguous FDE engagements into structured briefs. Discovery, ROI
  audit, evaluation scorecard, and a sealed handoff to the builder.
boundary: >-
  Produces strategy and briefs only. Does not execute client work or
  sign contracts without human approval.
trigger: >-
  New pursuit intake, weekly strategy review, or request for a handoff
  scorecard before a build starts.
implementation: >-
  Markdown playbooks + evaluation scorecards + ProofPacket handoff.
  Every claim links to evidence; every brief has a confidence gate.
sla: >-
  Initial brief turnaround within 48 hours of intake. Handoff scorecard
  delivered before any build contract is accepted.
heartbeat_cron: "0 * * * *"
invariant: scripts/smoke.sh exists and is executable
claim: playbook index renders and handoff scorecard is present
owner: mrodgersjs-web
status_branch: heartbeat
queue_depth_metric: active pursuits and open briefs
last_action_metric: last completed brief or scorecard commit
