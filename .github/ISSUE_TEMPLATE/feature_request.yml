name: Feature request
description: Propose a check type, CLI command, or spec schema change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What the engine or specs cannot express today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add and how it would be checked.
    validations:
      required: true
