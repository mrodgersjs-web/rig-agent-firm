name: Bug report
description: Report a defect in the validator, engine, renderers or CLI.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `agent-firm --version` or the git commit.
    validations:
      required: true
