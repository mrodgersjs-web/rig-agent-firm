name: Agent Firm Heartbeat

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated agent list, e.g. proof-studio,doctrine (empty = whole firm)'
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout agent-firm
        uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set output dir
        run: echo "OUT=$RUNNER_TEMP/heartbeat" >> "$GITHUB_ENV"

      - name: Install engine
        run: pip install .

      - name: Validate agent specs
        run: agent-firm validate --agents agents

      - name: Seed previous status (partial runs only)
        if: ${{ inputs.repos != '' }}
        run: |
          mkdir -p "$OUT"
          git fetch origin heartbeat || true
          git archive origin/heartbeat status 2>/dev/null | tar -x -C "$OUT" || true

      - name: Run heartbeat (GitHub REST API, workflow token)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ONLY: ${{ inputs.repos }}
        run: agent-firm heartbeat --agents agents --out "$OUT" --only "$ONLY"

      - name: Upload heartbeat output
        uses: actions/upload-artifact@v4
        with:
          name: heartbeat
          path: ${{ runner.temp }}/heartbeat
          if-no-files-found: error
          retention-days: 7

      - name: Commit status to heartbeat branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "agent-firm[bot]"
          git config user.email "agent-firm@users.noreply.github.com"
          # Move generated files out of the work tree before switching branches: the
          # heartbeat branch tracks files at these same paths.
          tmp_out="$(mktemp -d)"
          cp -r "$OUT/status" "$tmp_out/status"
          cp "$OUT/badge.json" "$OUT/dashboard.svg" "$tmp_out/"
          git fetch origin heartbeat || true
          if git rev-parse --verify origin/heartbeat >/dev/null 2>&1; then
            git checkout -f -B heartbeat origin/heartbeat
          else
            git checkout -b heartbeat
          fi
          rm -rf status badge.json dashboard.svg
          cp -r "$tmp_out/status" status
          cp "$tmp_out/badge.json" "$tmp_out/dashboard.svg" .
          git add status/*.json badge.json dashboard.svg
          git commit -m "heartbeat: update fleet status [skip ci]" || true
          git push origin heartbeat
