<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Agent Firm dashboard with six agent cards">
  <defs>
    <linearGradient id="dash-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0806"/>
      <stop offset="50%" stop-color="#0E0C09"/>
      <stop offset="100%" stop-color="#14110D"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1712"/>
      <stop offset="100%" stop-color="#12100D"/>
    </linearGradient>
    <linearGradient id="bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D9A5E"/>
      <stop offset="100%" stop-color="#5FD68A"/>
    </linearGradient>
    <linearGradient id="bar-warn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#E8C547"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#dash-bg)"/>

  <!-- Header -->
  <text x="60" y="64" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="24" font-weight="700" letter-spacing="2">AGENT FIRM // MISSION CONTROL</text>
  <text x="1140" y="64" text-anchor="end" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="14">LIVE</text>
  <circle cx="1160" cy="58" r="6" fill="#5FD68A">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid lines for mission-control aesthetic -->
  <line x1="60" y1="88" x2="1140" y2="88" stroke="#2A2520" stroke-width="1"/>

  <!-- Agent cards: 3 columns, 2 rows -->
  <g transform="translate(60, 120)">
    <!-- Card 1: Darius -->
    <g transform="translate(0, 0)">
      <rect width="340" height="210" rx="8" fill="url(#card-bg)" stroke="#2A2520" stroke-width="1"/>
      <circle cx="30" cy="34" r="8" fill="#5FD68A">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="40" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="18" font-weight="700">DARIUS</text>
      <text x="50" y="58" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">GTM Closer</text>
      <text x="30" y="95" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">QUEUE DEPTH</text>
      <rect x="30" y="108" width="280" height="8" rx="4" fill="#2A2520"/>
      <rect x="30" y="108" width="196" height="8" rx="4" fill="url(#bar-grad)"/>
      <text x="310" y="116" text-anchor="end" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">70%</text>
      <text x="30" y="150" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">LAST ACTION</text>
      <text x="30" y="170" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13">sent proposal #A-1842</text>
      <text x="30" y="190" fill="#5A544D" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">14s ago</text>
    </g>

    <!-- Card 2: Eleanor -->
    <g transform="translate(380, 0)">
      <rect width="340" height="210" rx="8" fill="url(#card-bg)" stroke="#2A2520" stroke-width="1"/>
      <circle cx="30" cy="34" r="8" fill="#5FD68A">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="40" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="18" font-weight="700">ELEANOR</text>
      <text x="50" y="58" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Editor-in-Chief</text>
      <text x="30" y="95" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">QUEUE DEPTH</text>
      <rect x="30" y="108" width="280" height="8" rx="4" fill="#2A2520"/>
      <rect x="30" y="108" width="112" height="8" rx="4" fill="url(#bar-grad)"/>
      <text x="310" y="116" text-anchor="end" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">40%</text>
      <text x="30" y="150" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">LAST ACTION</text>
      <text x="30" y="170" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13">approved essay v3</text>
      <text x="30" y="190" fill="#5A544D" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">1m ago</text>
    </g>

    <!-- Card 3: Marcus -->
    <g transform="translate(760, 0)">
      <rect width="340" height="210" rx="8" fill="url(#card-bg)" stroke="#2A2520" stroke-width="1"/>
      <circle cx="30" cy="34" r="8" fill="#5FD68A">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="40" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="18" font-weight="700">MARCUS</text>
      <text x="50" y="58" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Long-Form Writer</text>
      <text x="30" y="95" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">QUEUE DEPTH</text>
      <rect x="30" y="108" width="280" height="8" rx="4" fill="#2A2520"/>
      <rect x="30" y="108" width="252" height="8" rx="4" fill="url(#bar-warn)"/>
      <text x="310" y="116" text-anchor="end" fill="#E8C547" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">90%</text>
      <text x="30" y="150" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">LAST ACTION</text>
      <text x="30" y="170" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13">drafted 2,400 words</text>
      <text x="30" y="190" fill="#5A544D" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">4m ago</text>
    </g>

    <!-- Card 4: Yara -->
    <g transform="translate(0, 250)">
      <rect width="340" height="210" rx="8" fill="url(#card-bg)" stroke="#2A2520" stroke-width="1"/>
      <circle cx="30" cy="34" r="8" fill="#5FD68A">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.0s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="40" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="18" font-weight="700">YARA</text>
      <text x="50" y="58" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Short-Form Writer</text>
      <text x="30" y="95" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">QUEUE DEPTH</text>
      <rect x="30" y="108" width="280" height="8" rx="4" fill="#2A2520"/>
      <rect x="30" y="108" width="154" height="8" rx="4" fill="url(#bar-grad)"/>
      <text x="310" y="116" text-anchor="end" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">55%</text>
      <text x="30" y="150" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">LAST ACTION</text>
      <text x="30" y="170" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13">posted LinkedIn thread</text>
      <text x="30" y="190" fill="#5A544D" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">32s ago</text>
    </g>

    <!-- Card 5: Iris -->
    <g transform="translate(380, 250)">
      <rect width="340" height="210" rx="8" fill="url(#card-bg)" stroke="#2A2520" stroke-width="1"/>
      <circle cx="30" cy="34" r="8" fill="#5FD68A">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="40" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="18" font-weight="700">IRIS</text>
      <text x="50" y="58" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Research Director</text>
      <text x="30" y="95" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">QUEUE DEPTH</text>
      <rect x="30" y="108" width="280" height="8" rx="4" fill="#2A2520"/>
      <rect x="30" y="108" width="84" height="8" rx="4" fill="url(#bar-grad)"/>
      <text x="310" y="116" text-anchor="end" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">30%</text>
      <text x="30" y="150" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">LAST ACTION</text>
      <text x="30" y="170" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13">sealed research dossier</text>
      <text x="30" y="190" fill="#5A544D" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">8m ago</text>
    </g>

    <!-- Card 6: Theo -->
    <g transform="translate(760, 250)">
      <rect width="340" height="210" rx="8" fill="url(#card-bg)" stroke="#2A2520" stroke-width="1"/>
      <circle cx="30" cy="34" r="8" fill="#C8A96E">
        <animate attributeName="opacity" values="1;0.35;1" dur="1.9s" repeatCount="indefinite"/>
      </circle>
      <text x="50" y="40" fill="#F4F1EA" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="18" font-weight="700">THEO</text>
      <text x="50" y="58" fill="#8A8075" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Brand Guardian</text>
      <text x="30" y="95" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">QUEUE DEPTH</text>
      <rect x="30" y="108" width="280" height="8" rx="4" fill="#2A2520"/>
      <rect x="30" y="108" width="42" height="8" rx="4" fill="url(#bar-grad)"/>
      <text x="310" y="116" text-anchor="end" fill="#5FD68A" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">15%</text>
      <text x="30" y="150" fill="#8A8075" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="11">LAST ACTION</text>
      <text x="30" y="170" fill="#C8A96E" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="13">vetoed off-brand asset</text>
      <text x="30" y="190" fill="#5A544D" font-family="'SF Mono', Monaco, 'Courier New', monospace" font-size="10">12m ago</text>
    </g>
  </g>
</svg>